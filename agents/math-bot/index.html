<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { neon: '#39ff14' }, fontFamily: { inter: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../../style.css">
    <style>
        body { background-color: #000; color: #fff; }
        .bg-grid-pattern {
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
    </style>
</head>
<body class="flex flex-col h-screen font-inter bg-grid-pattern overflow-hidden">

    <header class="flex justify-between items-center px-6 py-4 border-b border-[#1a1a1a] bg-black/50 backdrop-blur-sm shrink-0">
        <div class="text-xs text-[#888] font-mono">Agents / Math Bot</div>
        <div class="flex items-center gap-2 text-[10px] border border-neon px-3 py-1 rounded-full text-neon font-semibold tracking-wider bg-black/50 shadow-[0_0_10px_rgba(57,255,20,0.2)]">
            <div class="w-1.5 h-1.5 bg-neon rounded-full animate-pulse"></div>SYSTEM ONLINE
        </div>
    </header>

    <div id="chatContainer" class="flex-1 flex flex-col gap-4 p-6 overflow-y-auto">
    <div class="text-center text-[#888] mt-20 animate-fade-in-up" id="welcomeMsg">
        <span class="material-symbols-outlined text-6xl mb-6 text-neon drop-shadow-[0_0_15px_rgba(57,255,20,0.4)]">calculate</span>
        <h1 class="text-3xl text-white font-medium mb-3">Math Bot Ready</h1>
        <p class="text-sm opacity-70">Calculation engine active. Awaiting formula.</p>
    </div>
    </div>

    <div class="w-full max-w-[800px] mx-auto px-4 pb-6 shrink-0 pt-4 bg-transparent">
        <div class="bg-[#0a0a0a] border border-[#262626] rounded-3xl p-2 flex items-center gap-2 focus-within:border-[#888] focus-within:bg-[#0f0f0f] transition-all shadow-lg">
            <button class="p-2 rounded-full text-[#888] hover:text-white hover:bg-[#222]"><span class="material-symbols-outlined">add_circle</span></button>
            <input id="mathInput" type="text" placeholder="Enter calculation..."  class="flex-1 bg-transparent border-none text-white text-[15px] outline-none p-2 placeholder-[#555]">
            <button id="sendBtn" class="p-2 rounded-full text-neon hover:bg-[rgba(57,255,20,0.1)]">
            <span class="material-symbols-outlined">send</span>
            </button>
        </div>
        <div class="text-center text-[10px] text-[#444] mt-3">Datatype AI may display inaccurate information. Verify critical data.</div>
    </div>
    <script>
    const mathInput = document.getElementById('mathInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatContainer = document.getElementById('chatContainer');
    const welcomeMsg = document.getElementById('welcomeMsg');

    function addMessage(text, isUser = false) {
        // Remove welcome message on first interaction
        if (welcomeMsg) welcomeMsg.remove();

        const msgDiv = document.createElement('div');
        msgDiv.className = `max-w-[80%] p-3 rounded-2xl text-[15px] animate-fade-in-up ${
            isUser 
            ? 'bg-[#1a1a1a] text-white self-end rounded-tr-none border border-[#333]' 
            : 'bg-neon/10 text-neon self-start rounded-tl-none border border-neon/30 shadow-[0_0_15px_rgba(57,255,20,0.1)]'
        }`;
        
        msgDiv.innerHTML = isUser ? text : `${text}`;
        chatContainer.appendChild(msgDiv);
        
        // Auto-scroll to bottom
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function processCalculation() {
        const expression = mathInput.value.trim();
        if (!expression) return;

        // 1. Add user's question to the UI
        addMessage(expression, true);
        mathInput.value = '';

        try {
            const response = await fetch(`https://datatype-math-bot.onrender.com/calculate?expression=${encodeURIComponent(expression)}`);
            const data = await response.json();

            if (data.status === "success") {
                // 2. Add bot's answer to the UI
                setTimeout(() => addMessage(data.answer, false), 500);
            } else {
                addMessage("Error: " + data.detail, false);
            }
        } catch (error) {
            addMessage("Backend unreachable. Ensure uvicorn is running on port 8000.", false);
        }
    }

    sendBtn.addEventListener('click', processCalculation);
    mathInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') processCalculation();
    });
    </script>

</body>
</html>
