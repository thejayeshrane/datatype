<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Bot // Terminal</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2339ff14' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='18' cy='5' r='3'%3E%3C/circle%3E%3Ccircle cx='6' cy='12' r='3'%3E%3C/circle%3E%3Ccircle cx='18' cy='19' r='3'%3E%3C/circle%3E%3Cline x1='8.59' y1='13.51' x2='15.42' y2='17.49'%3E%3C/line%3E%3Cline x1='15.41' y1='6.51' x2='8.59' y2='10.49'%3E%3C/line%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: { extend: { colors: { neon: '#39ff14' }, fontFamily: { mono: ['"JetBrains Mono"', 'monospace'] } } }
        }
    </script>
    
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #39ff14; }
        
        .typing-cursor::after {
            content: '█';
            animation: blink 1s step-start infinite;
            color: #39ff14;
            margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body class="bg-black text-gray-300 min-h-screen flex flex-col font-mono overflow-hidden">

    <header class="border-b border-gray-800 bg-gray-900/50 p-4 flex justify-between items-center select-none">
        <div class="flex items-center gap-2">
            <a href="../index.html" class="text-gray-500 hover:text-white transition-colors mr-4">← EXIT</a>
            <span class="text-neon text-sm tracking-widest">ECHO BOT</span>
        </div>
        <div class="flex gap-2">
            <div class="w-3 h-3 rounded-full bg-red-500/20 border border-red-500/50"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-500/20 border border-yellow-500/50"></div>
            <div class="w-3 h-3 rounded-full bg-neon/20 border border-neon/50"></div>
        </div>
    </header>

    <main id="terminal-output" class="flex-grow p-6 overflow-y-auto space-y-4 text-sm md:text-base">
        <div class="text-gray-500">
            <span class="text-neon">root@datatype:~$</span> ./init_neural_uplink.sh
        </div>
        <div class="text-gray-400">
            > Connecting to OpenRouter API... [OK]<br>
            > Authenticating Secure Channel... [OK]<br>
            > System Ready.
        </div>
        <div class="text-neon pt-4">
            [SYSTEM]: Uplink established. I am ready to process your request.
        </div>
    </main>

    <footer class="p-4 bg-black border-t border-gray-800">
        <form id="console-form" class="flex items-center gap-2 max-w-4xl mx-auto">
            <span class="text-neon">></span>
            <input type="text" id="user-input" 
                class="flex-grow bg-transparent border-none outline-none text-white placeholder-gray-700 focus:ring-0" 
                placeholder="Type command or message..." autocomplete="off" autofocus>
            <button type="submit" class="text-gray-500 hover:text-neon transition-colors">SEND</button>
        </form>
    </footer>

    <script>
        const form = document.getElementById('console-form');
        const input = document.getElementById('user-input');
        const output = document.getElementById('terminal-output');

        const scrollToBottom = () => {
            output.scrollTop = output.scrollHeight;
        };

        const addLine = (text, type = 'system') => {
            const div = document.createElement('div');
            
            if (type === 'user') {
                div.innerHTML = `<span class="text-gray-500">user@node-01:~$</span> <span class="text-white">${text}</span>`;
            } else if (type === 'bot') {
                div.innerHTML = `<span class="text-neon">[AI]:</span> ${text}`;
                div.className = "text-gray-300";
            } else if (type === 'error') {
                div.innerHTML = `<span class="text-red-500">[ERROR]:</span> ${text}`;
                div.className = "text-red-400";
            }
            
            output.appendChild(div);
            scrollToBottom();
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            // 1. Show User Input
            addLine(text, 'user');
            input.value = '';

            // 2. CREATE LOADING INDICATOR
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loading-line';
            loadingDiv.innerHTML = `<span class="text-neon animate-pulse">[THINKING...]</span>`;
            output.appendChild(loadingDiv);
            scrollToBottom();

            try {
                const response = await fetch('https://your-render-app.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                // 3. REMOVE LOADING INDICATOR
                const loader = document.getElementById('loading-line');
                if (loader) loader.remove();

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                addLine(data.reply, 'bot');

            } catch (error) {
                // Remove loader even if there is an error
                const loader = document.getElementById('loading-line');
                if (loader) loader.remove();
                
                console.error('Fetch error:', error);
                addLine("Connection Error: Backend may be sleeping.", 'error');
            }
        });

        window.onload = () => input.focus();
    </script>
</body>
</html>
