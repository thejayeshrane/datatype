<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arya-Man // Terminal</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2339ff14' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='18' cy='5' r='3'%3E%3C/circle%3E%3Ccircle cx='6' cy='12' r='3'%3E%3C/circle%3E%3Ccircle cx='18' cy='19' r='3'%3E%3C/circle%3E%3Cline x1='8.59' y1='13.51' x2='15.42' y2='17.49'%3E%3C/line%3E%3Cline x1='15.41' y1='6.51' x2='8.59' y2='10.49'%3E%3C/line%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: { extend: { colors: { neon: '#39ff14' }, fontFamily: { mono: ['"JetBrains Mono"', 'monospace'] } } }
        }
    </script>
    
    <style>
        /* Custom Scrollbar */
        #terminal-output::-webkit-scrollbar { width: 8px; }
        #terminal-output::-webkit-scrollbar-track { background: #000; }
        #terminal-output::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        #terminal-output::-webkit-scrollbar-thumb:hover { background: #39ff14; }
        
        .typing-cursor::after {
            content: '█';
            animation: blink 1s step-start infinite;
            color: #39ff14;
            margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>

<body class="bg-black text-gray-300 h-[100dvh] flex flex-col font-mono overflow-hidden supports-[height:100cqh]:h-[100cqh]">

    <header class="border-b border-gray-800 bg-gray-900/50 p-4 flex justify-between items-center select-none shrink-0">
        <div class="flex items-center gap-2">
            <a href="../index.html" class="text-gray-500 hover:text-white transition-colors mr-4">← EXIT</a>
            <span class="text-neon text-sm tracking-widest">ARYA-MAN</span>
        </div>
        <div class="flex gap-2">
            <div class="w-3 h-3 rounded-full bg-red-500/20 border border-red-500/50"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-500/20 border border-yellow-500/50"></div>
            <div class="w-3 h-3 rounded-full bg-neon/20 border border-neon/50"></div>
        </div>
    </header>

    <main id="terminal-output" class="flex-grow p-4 md:p-6 overflow-y-auto space-y-4 text-sm md:text-base scroll-smooth">
        <div class="text-gray-500">
            <span class="text-neon">root@datatype:~$</span> ./init_neural_uplink.sh
        </div>
        <div class="text-gray-400">
            > Connecting to OpenRouter API... [OK]<br>
            > Authenticating Secure Channel... [OK]<br>
            > System Ready.
        </div>
        <div class="text-neon pt-4">
            [SYSTEM]: Uplink established. I am ready to process your request.
        </div>
    </main>

    <footer class="p-4 bg-black border-t border-gray-800 shrink-0 pb-safe">
        <form id="console-form" class="flex items-end gap-2 max-w-4xl mx-auto">
            <span class="text-neon py-3">></span>
            
            <textarea id="user-input" rows="1"
                class="flex-grow bg-transparent border-none outline-none text-white text-base placeholder-gray-700 focus:ring-0 resize-none overflow-hidden max-h-32 py-3 leading-relaxed" 
                placeholder="Type command or message..." autofocus></textarea>
            
            <button type="submit" class="text-gray-500 hover:text-neon transition-colors py-3 px-2 font-bold text-sm">SEND</button>
        </form>
    </footer>

    <script>
        const form = document.getElementById('console-form');
        const input = document.getElementById('user-input');
        const output = document.getElementById('terminal-output');

        // Scroll helper
        const scrollToBottom = () => {
            output.scrollTop = output.scrollHeight;
        };

        // Auto-Resize Textarea
        const autoResize = () => {
            input.style.height = 'auto'; 
            input.style.height = input.scrollHeight + 'px';
        };
        input.addEventListener('input', autoResize);

        // Handle Enter vs Shift+Enter
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                // Check if on mobile (touch device)
                if (window.matchMedia("(pointer: coarse)").matches) {
                     input.blur(); // Close keyboard on mobile send
                }
                form.requestSubmit();
            }
        });

        // Add Line to Terminal
        const addLine = (text, type = 'system') => {
            const div = document.createElement('div');
            const formattedText = text.replace(/\n/g, '<br>');
            
            if (type === 'user') {
                div.innerHTML = `<span class="text-gray-500">user@node-01:~$</span> <span class="text-white">${formattedText}</span>`;
            } else if (type === 'bot') {
                div.innerHTML = `<span class="text-neon">[AI]:</span> ${formattedText}`;
                div.className = "text-gray-300";
            } else if (type === 'error') {
                div.innerHTML = `<span class="text-red-500">[ERROR]:</span> ${formattedText}`;
                div.className = "text-red-400";
            } else if (type === 'info') {
                div.innerHTML = `<span class="text-yellow-500">[SYSTEM]:</span> ${formattedText}`;
                div.className = "text-yellow-400 italic";
            }
            
            output.appendChild(div);
            scrollToBottom();
        };

        // Robust Retry Logic (60s Timeout)
        const fetchWithRetry = async (url, options, retries = 12, delay = 5000) => {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    
                    if ([502, 503, 504].includes(response.status)) {
                        throw new Error(`Server waking up (Status ${response.status})...`);
                    }
                    
                    if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                    
                    return await response.json();

                } catch (error) {
                    console.warn(`Attempt ${i + 1}/${retries} failed: ${error.message}`);
                    
                    if (i < retries - 1) {
                        if (i === 0) {
                            addLine("...Uplink dormant. Waking mainframe (this may take 60s)...", 'info');
                            scrollToBottom();
                        }
                        await new Promise(res => setTimeout(res, delay));
                    } else {
                        throw error;
                    }
                }
            }
        };

        // Submit Handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            // 1. Show User Input
            addLine(text, 'user');
            input.value = '';
            input.style.height = 'auto'; // Reset height

            // 2. Show Loader
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loading-line';
            loadingDiv.innerHTML = `<span class="text-neon animate-pulse">[THINKING...]</span>`;
            output.appendChild(loadingDiv);
            scrollToBottom();

            try {
                // 3. Send to Render
                const data = await fetchWithRetry('https://datatype-backend.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const loader = document.getElementById('loading-line');
                if (loader) loader.remove();
                addLine(data.reply, 'bot');

            } catch (error) {
                const loader = document.getElementById('loading-line');
                if (loader) loader.remove();
                addLine("Uplink failed. System is offline.", 'error');
            }
        });

        // Focus logic
        window.onload = () => {
             // Only auto-focus on desktop to prevent keyboard popping up on mobile load
             if (!window.matchMedia("(pointer: coarse)").matches) {
                 input.focus();
             }
        };
    </script>
</body>
</html>
