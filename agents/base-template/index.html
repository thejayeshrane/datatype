<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { neon: '#39ff14' }, fontFamily: { inter: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col h-screen font-inter bg-grid-pattern overflow-hidden bg-black text-white">

    <header class="flex justify-between items-center px-6 py-4 border-b border-[#1a1a1a] bg-black/50 backdrop-blur-sm">
        <div class="text-xs text-[#888] font-mono">Agents / Base Template / View</div>
        <div class="flex items-center gap-2 text-[10px] border border-neon px-3 py-1 rounded-full text-neon font-semibold tracking-wider bg-black/50 shadow-[0_0_10px_rgba(57,255,20,0.2)]">
            <div class="w-1.5 h-1.5 bg-neon rounded-full animate-pulse"></div>SYSTEM ONLINE
        </div>
    </header>

    <div class="flex-1 flex flex-col justify-center items-center px-4 overflow-y-auto">
        <div class="text-center text-[#888] animate-fade-in-up">
            <span class="material-symbols-outlined text-6xl mb-6 text-neon drop-shadow-[0_0_15px_rgba(57,255,20,0.4)]">extension</span>
            <h1 class="text-3xl text-white font-medium mb-3">Base Agent Ready</h1>
            <p class="text-sm opacity-70">Template loaded. Duplicate this folder to create a new agent.</p>
        </div>
    </div>

    <div class="w-full max-w-[800px] mx-auto px-4 pb-6">
        <div class="bg-[#0a0a0a] border border-[#262626] rounded-3xl p-2 flex items-center gap-2 focus-within:border-[#888] focus-within:bg-[#0f0f0f] transition-all">
            <button class="p-2 rounded-full text-[#888] hover:text-white hover:bg-[#222]"><span class="material-symbols-outlined">add_circle</span></button>
            <input type="text" placeholder="Enter command or message..." class="flex-1 bg-transparent border-none text-white text-[15px] outline-none p-2 placeholder-[#555]">
            <button class="p-2 rounded-full text-[#888] hover:text-white hover:bg-[#222]"><span class="material-symbols-outlined">mic</span></button>
            <button class="p-2 rounded-full text-neon hover:bg-[rgba(57,255,20,0.1)]"><span class="material-symbols-outlined">send</span></button>
        </div>
        <div class="text-center text-[10px] text-[#444] mt-3">Datatype AI may display inaccurate information. Verify critical data.</div>
    </div>

</body>
</html>
