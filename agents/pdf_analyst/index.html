<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>PDF Analyst | Research Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Scrollbar for a "Hacker" feel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #39FF14; }
        
        .neon-text { color: #39FF14; text-shadow: 0 0 5px rgba(57, 255, 20, 0.5); }
        .neon-border { border: 1px solid #39FF14; box-shadow: 0 0 5px rgba(57, 255, 20, 0.2); }
    </style>
</head>
<body class="bg-black text-gray-300 font-mono h-screen flex flex-col overflow-hidden">

    <header class="p-4 border-b border-gray-800 flex justify-between items-center bg-black/90 z-10">
        <h1 class="text-xl font-bold neon-text">AGENT 003 // DOC READER</h1>
        <div id="statusIndicator" class="w-3 h-3 rounded-full bg-red-500"></div>
    </header>

    <main id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 pb-32">
        <div class="flex flex-col items-center justify-center h-full text-center space-y-4" id="emptyState">
            <div class="p-4 border-2 border-dashed border-gray-700 rounded-xl hover:border-[#39FF14] transition-colors cursor-pointer" onclick="document.getElementById('pdfUpload').click()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="mt-2 text-sm">Tap to Upload PDF</p>
            </div>
            <p class="text-xs text-gray-500">Supported: PDF (Max 10MB)</p>
        </div>
    </main>

    <div class="p-4 bg-black border-t border-gray-800 fixed bottom-0 w-full lg:static lg:w-auto">
        
        <div id="filePreview" class="hidden mb-2 text-xs text-[#39FF14] flex items-center">
            <span class="mr-2">📎</span> <span id="fileName">document.pdf</span>
        </div>

        <form onsubmit="handleSubmit(event)" class="flex gap-2">
            <input type="file" id="pdfUpload" class="hidden" accept=".pdf" onchange="handleFileSelect(event)">
            
            <input type="text" id="questionInput" 
                   class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-[#39FF14] transition-colors"
                   placeholder="Ask about the document..." disabled>
            
            <button type="submit" id="sendBtn" class="bg-gray-800 text-white p-3 rounded-lg hover:bg-[#39FF14] hover:text-black transition-all disabled:opacity-50" disabled>
                ➤
            </button>
        </form>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/agent/pdf"; // CHANGE THIS ON DEPLOYMENT
        let currentFile = null;

        // 1. Handle File Selection
        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            currentFile = file;
            
            // UI Updates
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('filePreview').classList.remove('hidden');
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('questionInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('statusIndicator').className = "w-3 h-3 rounded-full bg-yellow-500 animate-pulse";

            // Add system message
            addMessage("System", `Uploading ${file.name}...`);

            // Upload Logic
            const formData = new FormData();
            formData.append("file", file);
            formData.append("question", ""); // No question yet, just upload

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                addMessage("System", data.response); // "Split into X chunks..."
                document.getElementById('statusIndicator').className = "w-3 h-3 rounded-full bg-[#39FF14]";
            } catch (err) {
                addMessage("System", "Error uploading file: " + err.message);
                document.getElementById('statusIndicator').className = "w-3 h-3 rounded-full bg-red-500";
            }
        }

        // 2. Handle Question Submission
        async function handleSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            // UI Updates
            addMessage("You", question);
            input.value = "";
            addMessage("Agent", "Scanning document...");

            const formData = new FormData();
            formData.append("question", question);

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                
                // Remove "Scanning..." and show real answer
                const lastMsg = document.getElementById('chatBox').lastElementChild;
                lastMsg.remove(); 
                
                addMessage("Agent", data.response);
            } catch (err) {
                addMessage("System", "Error: " + err.message);
            }
        }

        // 3. Helper to Add Messages
        function addMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            const isUser = sender === "You";
            
            div.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'}`;
            div.innerHTML = `
                <div class="max-w-[85%] rounded-2xl px-4 py-2 ${isUser ? 'bg-[#39FF14] text-black rounded-tr-none' : 'bg-gray-800 text-gray-200 rounded-tl-none'}">
                    <p class="text-xs font-bold mb-1 opacity-50">${sender}</p>
                    <p class="leading-relaxed">${text}</p>
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
