<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent 003 // PDF Analyst</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2339ff14' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='18' cy='5' r='3'%3E%3C/circle%3E%3Ccircle cx='6' cy='12' r='3'%3E%3C/circle%3E%3Ccircle cx='18' cy='19' r='3'%3E%3C/circle%3E%3Cline x1='8.59' y1='13.51' x2='15.42' y2='17.49'%3E%3C/line%3E%3Cline x1='15.41' y1='6.51' x2='8.59' y2='10.49'%3E%3C/line%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { neon: '#39ff14', dark: '#0a0a0a' },
                    fontFamily: { mono: ['"JetBrains Mono"', 'monospace'], sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; }
        .grid-bg {
            background-image: linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #39FF14; }
        
        .typing-dot { animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="text-gray-100 h-screen flex flex-col grid-bg overflow-hidden">

    <header class="border-b border-neon/20 bg-black/80 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <a href="/" class="text-gray-400 hover:text-neon transition-colors p-2 -ml-2">
                <span class="text-xl font-mono">← EXIT AGENT</span>
            </a>
            <div class="font-mono text-sm tracking-widest text-neon drop-shadow-[0_0_5px_rgba(57,255,20,0.5)]">
                AGENT_003 // DOC_READER
            </div>
            <div id="statusIndicator" class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_red]"></div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col min-h-0">
        
        <div id="chatBox" class="flex-1 overflow-y-auto space-y-6 pr-2 mb-4 scroll-smooth">
            
            <div class="flex flex-col items-center justify-center h-full text-center space-y-6 opacity-60" id="emptyState">
                <div class="w-20 h-20 border border-gray-700 rounded-xl flex items-center justify-center mb-4 mx-auto text-gray-600">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <h2 class="text-xl font-bold font-mono">NO DATA DETECTED</h2>
                <p class="text-sm max-w-md">Upload a PDF document to initialize the RAG (Retrieval-Augmented Generation) memory sequence.</p>
                <button onclick="document.getElementById('pdfUpload').click()" class="border border-neon text-neon px-6 py-2 rounded hover:bg-neon hover:text-black transition-all font-mono text-sm uppercase tracking-wider">
                    [ Upload Document ]
                </button>
            </div>

        </div>

        <div id="filePreview" class="hidden bg-gray-900/50 border border-neon/30 rounded px-4 py-2 mb-2 flex justify-between items-center text-xs font-mono text-neon">
            <div class="flex items-center">
                <span class="mr-2">📎</span> 
                <span id="fileName">data.pdf</span>
            </div>
            <span class="text-gray-500">MEMORY ACTIVE</span>
        </div>

        <div class="relative bg-black border border-gray-800 rounded-lg p-2 focus-within:border-neon/50 focus-within:shadow-[0_0_15px_rgba(57,255,20,0.1)] transition-all">
            <form onsubmit="handleSubmit(event)" class="flex gap-2">
                <input type="file" id="pdfUpload" class="hidden" accept=".pdf" onchange="handleFileSelect(event)">
                
                <button type="button" onclick="document.getElementById('pdfUpload').click()" class="p-3 text-gray-500 hover:text-neon transition-colors" title="Change File">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                </button>

                <input type="text" id="questionInput" 
                       class="flex-1 bg-transparent border-none focus:ring-0 text-white placeholder-gray-600 font-mono text-sm"
                       placeholder="Upload a PDF to start..." disabled autocomplete="off">
                
                <button type="submit" id="sendBtn" class="bg-gray-800 text-gray-400 p-2 px-4 rounded hover:bg-neon hover:text-black transition-all disabled:opacity-50 disabled:cursor-not-allowed font-bold" disabled>
                    ↵
                </button>
            </form>
        </div>
        
        <div class="text-center mt-2">
             <p class="text-[10px] text-gray-600 font-mono">NODE: <span id="nodeUrl">CONNECTING...</span></p>
        </div>
    </main>

    <script>
        // --- SMART CONFIGURATION ---
        const isLocal = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';

        const API_URL = isLocal 
            ? "http://127.0.0.1:8000/agent/pdf" 
            : "https://datatype-backend.onrender.com/agent/pdf"; // <--- Render link     

        document.getElementById('nodeUrl').textContent = isLocal ? "LOCALHOST::8000" : "CLOUD::RENDER";

        // --- UI LOGIC ---

        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            // 1. Update UI
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('filePreview').classList.remove('hidden');
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('questionInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('questionInput').placeholder = "Ask a question about " + file.name + "...";
            document.getElementById('questionInput').focus();
            
            // 2. Add System Message
            addMessage("System", `Initializing upload sequence for: ${file.name}...`);
            setLoading(true);

            // 3. Upload to Backend
            const formData = new FormData();
            formData.append("file", file);
            formData.append("question", ""); // No question yet

            try {
                const response = await fetch(API_URL, { method: "POST", body: formData });
                if (!response.ok) throw new Error("Server rejected connection");
                
                const data = await response.json();
                addMessage("System", data.response); // "Split into X chunks..."
                document.getElementById('statusIndicator').className = "w-2 h-2 rounded-full bg-neon shadow-[0_0_8px_#39ff14]";
            } catch (err) {
                addMessage("System", "CRITICAL ERROR: " + err.message);
                addMessage("System", "Ensure your Backend is running on: " + API_URL);
                document.getElementById('statusIndicator').className = "w-2 h-2 rounded-full bg-red-500";
            } finally {
                setLoading(false);
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            addMessage("You", question);
            input.value = "";
            setLoading(true);

            const formData = new FormData();
            formData.append("question", question);

            try {
                const response = await fetch(API_URL, { method: "POST", body: formData });
                const data = await response.json();
                removeLoading();
                addMessage("Agent", data.response);
            } catch (err) {
                removeLoading();
                addMessage("System", "Connection lost. Retry?");
            }
        }

        // --- HELPER FUNCTIONS ---

        function addMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            const isUser = sender === "You";
            const isSystem = sender === "System";
            
            let bubbleClass = isUser 
                ? "bg-gray-800 text-white ml-auto border border-gray-700" 
                : (isSystem ? "bg-red-900/20 text-red-400 border border-red-900/50 w-full text-center text-xs font-mono py-1" : "bg-black border border-neon/40 text-gray-200 shadow-[0_0_10px_rgba(57,255,20,0.1)]");

            if (isSystem && text.includes("chunks")) { // Success message style
                bubbleClass = "bg-green-900/20 text-neon border border-neon/30 w-full text-center text-xs font-mono py-1";
            }

            div.className = `max-w-[85%] rounded-lg px-4 py-3 ${isUser ? 'ml-auto' : 'mr-auto'} ${bubbleClass}`;
            
            // Allow basic markdown-like bolding
            const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<span class="text-neon font-bold">$1</span>');
            
            div.innerHTML = isSystem ? formattedText : `
                <div class="text-[10px] uppercase font-bold mb-1 opacity-50 tracking-wider ${isUser ? 'text-right' : 'text-left text-neon'}">${sender}</div>
                <div class="leading-relaxed text-sm">${formattedText}</div>
            `;
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setLoading(isLoading) {
            if (isLoading) {
                const chatBox = document.getElementById('chatBox');
                const div = document.createElement('div');
                div.id = "loadingIndicator";
                div.className = "flex space-x-1 p-4 bg-black border border-gray-800 rounded-lg w-fit";
                div.innerHTML = `
                    <div class="w-2 h-2 bg-neon rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-neon rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-neon rounded-full typing-dot"></div>
                `;
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;
            } else {
                removeLoading();
            }
        }

        function removeLoading() {
            const loader = document.getElementById('loadingIndicator');
            if (loader) loader.remove();
        }
    </script>
</body>
</html>
