<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>datatype.org</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: '#39ff14', 
                        darkbg: '#050505',
                        panel: '#0a0a0a'
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                        mono: ['monospace']
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2339ff14' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='18' cy='5' r='3'%3E%3C/circle%3E%3Ccircle cx='6' cy='12' r='3'%3E%3C/circle%3E%3Ccircle cx='18' cy='19' r='3'%3E%3C/circle%3E%3Cline x1='8.59' y1='13.51' x2='15.42' y2='17.49'%3E%3C/line%3E%3Cline x1='15.41' y1='6.51' x2='8.59' y2='10.49'%3E%3C/line%3E%3C/svg%3E">
</head>
<body class="bg-black text-gray-100 flex flex-col h-screen antialiased relative overflow-hidden font-inter">

    <div id="landingPage" class="fixed inset-0 z-[100] bg-black flex flex-col min-h-screen transition-transform duration-1000 ease-[cubic-bezier(0.7,0,0.3,1)] overflow-y-auto">
        
        <header class="py-6 px-6 md:px-12 flex justify-between items-center relative z-20">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
                <svg class="w-8 h-8 text-neon opacity-90 drop-shadow-[0_0_8px_rgba(57,255,20,0.5)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
                <div class="text-xl font-bold tracking-tight text-white">datatype<span class="text-neon">.org</span></div>
            </div>
        </header>

        <main class="flex-grow flex items-center px-6 md:px-16 lg:px-24 py-12 relative z-10">
            <div class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-center">
                
                <div class="space-y-12 order-2 lg:order-1">
                    <h1 class="text-4xl sm:text-5xl lg:text-7xl font-bold leading-tight drop-shadow-2xl">
                        A research lab for <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-200">everything <span class="flowing-underline text-white cursor-default">data</span></span><span class="text-neon">.</span>
                    </h1>

                    <div class="flex flex-wrap gap-12">
                        <div class="flex flex-col gap-3 group cursor-pointer" onclick="revealConsole()">
                            <span class="material-symbols-outlined text-3xl text-gray-200 group-hover:text-neon transition-colors">search</span>
                            <div class="text-sm font-medium leading-snug text-gray-200 group-hover:text-white transition-colors">Data <br> Discovery</div>
                        </div>
                        <div class="flex flex-col gap-3 group cursor-pointer" onclick="revealConsole()">
                            <span class="material-symbols-outlined text-3xl text-gray-200 group-hover:text-neon transition-colors">science</span>
                            <div class="text-sm font-medium leading-snug text-gray-200 group-hover:text-white transition-colors">Agentic <br> Research</div>
                        </div>
                        <div class="flex flex-col gap-3 group cursor-pointer">
                            <span class="material-symbols-outlined text-3xl text-gray-200 group-hover:text-neon transition-colors">verified_user</span>
                            <div class="text-sm font-medium leading-snug text-gray-200 group-hover:text-white transition-colors">Integrity <br> Testing</div>
                        </div>
                    </div>

                    <button onclick="revealConsole()" class="inline-block w-full sm:w-auto border border-neon/50 text-neon px-8 py-3 font-medium rounded-md hover:bg-neon hover:text-black hover:shadow-[0_0_15px_rgba(57,255,20,0.4)] transition-all duration-500 tracking-wide text-center">
                        Access AI Agents
                    </button>
                </div>

                <div class="flex justify-center items-center lg:justify-end order-1 lg:order-2 mb-8 lg:mb-0">
                    <div class="relative w-80 h-80 sm:w-[450px] sm:h-[450px] lg:w-[650px] lg:h-[650px] animate-float">
                        <div class="absolute inset-0 bg-neon/5 rounded-full blur-[80px]"></div>
                        <svg class="w-full h-full drop-shadow-[0_0_30px_rgba(255,255,255,0.1)]" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g class="network-group">
                                <path d="M100 280 L200 200 L300 280 L200 350 Z" stroke="#666" stroke-width="1.5" stroke-opacity="0.6"/>
                                <path d="M200 200 L200 100 L120 160 L200 200" stroke="#666" stroke-width="1.5" stroke-opacity="0.6"/>
                                <path d="M200 200 L280 160 L200 100" stroke="#666" stroke-width="1.5" stroke-opacity="0.6"/>
                                <path d="M120 160 L60 200 L100 280" stroke="#666" stroke-width="1.5" stroke-opacity="0.6"/>
                                <path d="M280 160 L340 200 L300 280" stroke="#666" stroke-width="1.5" stroke-opacity="0.6"/>
                                <path d="M200 350 L200 200" stroke="#666" stroke-width="1.5" stroke-opacity="0.6"/>
                                <defs><radialGradient id="sphereGrad" cx="30%" cy="30%" r="70%"><stop offset="0%" style="stop-color: #fff; stop-opacity: 1" /><stop offset="100%" style="stop-color: #888; stop-opacity: 1" /></radialGradient></defs>
                                <circle cx="200" cy="100" r="10" fill="url(#sphereGrad)" /><circle cx="120" cy="160" r="8" fill="url(#sphereGrad)" /><circle cx="280" cy="160" r="8" fill="url(#sphereGrad)" /><circle cx="60" cy="200" r="7" fill="url(#sphereGrad)" /><circle cx="200" cy="200" r="12" fill="url(#sphereGrad)" /><circle cx="340" cy="200" r="7" fill="url(#sphereGrad)" /><circle cx="100" cy="280" r="9" fill="url(#sphereGrad)" /><circle cx="300" cy="280" r="9" fill="url(#sphereGrad)" /><circle cx="200" cy="350" r="10" fill="url(#sphereGrad)" />
                            </g>
                        </svg>
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="py-8 px-6 md:px-12 flex flex-col md:flex-row justify-between items-center text-sm text-gray-400 gap-6 md:gap-0 mt-auto relative z-20">
            <div class="flex gap-8">
                <a href="#" class="hover:text-neon transition-colors">About</a>
                <a href="#" class="hover:text-neon transition-colors">Lab Notes</a>
                <a href="#" class="hover:text-neon transition-colors">Contact</a>
            </div>
            <div class="font-mono text-xs text-gray-500 uppercase tracking-widest">© 2026 datatype.org</div>
        </footer>
    </div>

    <div id="consoleApp" class="absolute inset-0 z-0 flex h-full w-full bg-black">
        
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/80 z-40 hidden md:hidden glass-overlay" onclick="toggleSidebar()"></div>

        <aside id="consoleSidebar" class="fixed inset-y-0 left-0 z-50 w-[280px] bg-darkbg border-r border-[#262626] transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col p-6 md:static md:flex">
            
            <button class="md:hidden absolute top-4 right-4 text-gray-500 hover:text-white" onclick="toggleSidebar()">
                <span class="material-symbols-outlined">close</span>
            </button>

            <div class="brand-header flex items-center gap-2 mb-10 pl-2 cursor-pointer" onclick="location.reload()">
                <svg class="w-7 h-7 text-neon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                <span class="font-bold text-white text-base tracking-tight">datatype.org</span>
            </div>

            <div class="flex-1 overflow-y-auto space-y-2">
                <div class="text-[11px] uppercase text-[#666] mb-3 pl-3 font-semibold tracking-wider">Active Agents</div>
                
                <button id="btn-echo" onclick="loadAgent('echo-bot')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-lg text-[#888] hover:text-white hover:bg-[#111] border border-transparent transition-all">
                    <span class="material-symbols-outlined text-[20px]">chat</span>
                    <div class="text-left flex flex-col"><span class="text-[13px] font-medium">Echo Bot</span><span class="text-[10px] opacity-60 font-mono">ID: 001</span></div>
                </button>

                <button id="btn-math" onclick="loadAgent('math-bot')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-lg text-[#888] hover:text-white hover:bg-[#111] border border-transparent transition-all">
                    <span class="material-symbols-outlined text-[20px]">calculate</span>
                    <div class="text-left flex flex-col"><span class="text-[13px] font-medium">Math Bot</span><span class="text-[10px] opacity-60 font-mono">ID: 002</span></div>
                </button>

                <button id="btn-base" onclick="loadAgent('base-template')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-lg text-[#888] hover:text-white hover:bg-[#111] border border-transparent transition-all">
                    <span class="material-symbols-outlined text-[20px]">extension</span>
                    <div class="text-left flex flex-col"><span class="text-[13px] font-medium">Base Template</span><span class="text-[10px] opacity-60 font-mono">ID: 000</span></div>
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative bg-black w-full h-full">
            
            <div class="md:hidden flex justify-between items-center p-4 border-b border-[#222] bg-black">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="text-white hover:text-neon">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                    <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
                        <svg class="w-5 h-5 text-neon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                        <span class="font-bold text-white text-sm tracking-tight">datatype.org</span>
                    </div>
                </div>
            </div>

            <iframe id="agentFrame" src="" class="w-full h-full border-none opacity-0 transition-opacity duration-500" title="Agent View"></iframe>
        </main>
    </div>

    <script>
        function revealConsole() {
            document.getElementById('landingPage').style.transform = 'translateY(-100vh)';
            loadAgent('echo-bot'); 
        }

        function loadAgent(folderName) {
            const frame = document.getElementById('agentFrame');
            const buttons = document.querySelectorAll('.nav-btn');
            
            // Reset Button Styles
            buttons.forEach(btn => {
                btn.classList.remove('bg-neon/10', 'text-neon', 'border-neon/30');
                btn.classList.add('text-[#888]');
            });

            // Determine Active ID
            let activeBtnId = 'btn-echo';
            if (folderName === 'math-bot') activeBtnId = 'btn-math';
            if (folderName === 'base-template') activeBtnId = 'btn-base';

            // Highlight Active Button
            const activeBtn = document.getElementById(activeBtnId);
            if(activeBtn) {
                activeBtn.classList.remove('text-[#888]');
                activeBtn.classList.add('bg-neon/10', 'text-neon', 'border-neon/30');
            }

            // Fade Effect for Iframe
            frame.style.opacity = '0';
            setTimeout(() => {
                frame.src = `agents/${folderName}/index.html`;
                frame.onload = () => { frame.style.opacity = '1'; };
            }, 200);

            // Auto-close sidebar on mobile
            if(window.innerWidth < 768) toggleSidebar();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('consoleSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
