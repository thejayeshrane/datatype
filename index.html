<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datatype.org</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[url('brain-bg.png')] bg-cover bg-center bg-no-repeat text-white flex flex-col min-h-screen antialiased">

    <header class="py-6 px-8">
        <div class="text-xl font-semibold tracking-tight">Datatype.org</div>
    </header>

    <main class="flex-grow flex items-center px-8 md:px-16 lg:px-24 py-12">
        <div class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
            
            <div class="space-y-12">
                <h1 class="text-5xl md:text-5xl lg:text-6xl font-bold leading-tight">
                    A research lab for <br> everything data.
                </h1>

                <div class="flex gap-12">
                    <div class="flex flex-col gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <div class="text-sm font-medium leading-snug text-gray-300">Data <br> Discovery</div>
                    </div>
                    <div class="flex flex-col gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                        </svg>
                        <div class="text-sm font-medium leading-snug text-gray-300">Agentic <br> Research</div>
                    </div>
                    <div class="flex flex-col gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <div class="text-sm font-medium leading-snug text-gray-300">Integrity <br> Testing</div>
                    </div>
                </div>

                <div>
                    <button class="bg-white text-black px-8 py-3 font-medium rounded-md hover:bg-gray-200 transition-colors">
                        View Research & Case Studies
                    </button>
                </div>
            </div>

            <div></div>
        </div>
    </main>

    <footer class="py-8 px-8 md:px-16 lg:px-24 flex flex-col md:flex-row justify-between items-center text-sm text-gray-500">
        <div class="flex gap-8 mb-4 md:mb-0">
            <a href="#" class="hover:text-gray-300 transition-colors">About</a>
            <a href="#" class="hover:text-gray-300 transition-colors">Lab Notes</a>
            <a href="#" class="hover:text-gray-300 transition-colors">Contact</a>
        </div>
        <div>
            © 2026 Datatype.org - India
        </div>
    </footer>

</body>
</html>
