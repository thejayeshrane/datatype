<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - datatype.org</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: '#39ff14', // The Matrix/Cyberpunk Green
                    },
                    boxShadow: {
                        'neon': '0 0 10px rgba(57, 255, 20, 0.5), 0 0 20px rgba(57, 255, 20, 0.3)',
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Slow Zoom Animation */
        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
        .animate-slow-zoom {
            animation: slowZoom 20s infinite alternate ease-in-out;
        }

        /* Flowing Underline Animation */
        @keyframes underlineFlow {
            0% { width: 0; right: 0; left: auto; }
            50% { width: 100%; right: 0; left: auto; }
            51% { width: 100%; left: 0; right: auto; }
            100% { width: 0; left: 0; right: auto; }
        }

        .flowing-underline {
            position: relative;
            display: inline-block;
        }

        /* Default state: Thicker but dimmer glow */
        .flowing-underline::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            height: 4px;
            background-color: #39ff14;
            box-shadow: 0 0 4px rgba(57, 255, 20, 0.3); /* Lower default intensity */
            animation: underlineFlow 4s infinite ease-in-out;
            transition: box-shadow 0.3s ease;
        }

        /* Hover state: Bright glow */
        .flowing-underline:hover::after {
            box-shadow: 0 0 12px #39ff14;
        }
    </style>
</head>
<body class="bg-black text-gray-100 flex flex-col min-h-screen antialiased relative overflow-hidden">

    <div class="fixed inset-0 z-0">
        <img src="brain-bg.png" 
             alt="Background" 
             class="w-full h-full object-cover object-[60%_center] md:object-center opacity-60 animate-slow-zoom transition-all duration-700">
        
        <div class="absolute inset-0 bg-black/80 md:bg-black/50 bg-gradient-to-t from-black via-transparent to-transparent"></div>
    </div>

    <div class="relative z-10 flex flex-col min-h-screen">
        
        <header class="py-6 px-6 md:px-12 flex justify-between items-center">
            <a href="/" class="flex items-center gap-3 group transition-all duration-300">
                <svg class="w-8 h-8 text-neon opacity-70 drop-shadow-[0_0_2px_rgba(57,255,20,0.3)] group-hover:opacity-100 group-hover:drop-shadow-[0_0_8px_rgba(57,255,20,0.8)] transition-all duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
        
                <div class="text-xl font-bold tracking-tight text-white">
                    datatype<span class="text-neon">.org</span>
                </div>
            </a>
    
            <div class="hidden md:flex items-center gap-2 text-xs font-mono text-neon/80 border border-neon/30 px-3 py-1 rounded-full bg-black/50 backdrop-blur-sm">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-neon opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-neon"></span>
                </span>
                SYSTEM ONLINE
            </div>
        </header>

        <main class="flex-grow flex items-center px-6 md:px-16 lg:px-24 py-8 md:py-12">
            <div class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-center">
                
                <div class="space-y-10 md:space-y-12">
                    
                    <h1 class="text-4xl sm:text-5xl lg:text-7xl font-bold leading-tight max-w-[12ch] sm:max-w-2xl drop-shadow-2xl">
                        A research lab for <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-200">everything <span class="flowing-underline text-white cursor-default">data</span></span><span class="text-neon">.</span>
                    </h1>

                    <div class="flex flex-wrap gap-8 md:gap-12">
                        <div class="flex flex-col gap-3 min-w-[80px] group cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-100 group-hover:text-neon transition-colors duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            <div class="text-sm font-medium leading-snug text-gray-200 group-hover:text-white transition-colors">Data <br> Discovery</div>
                        </div>
                        <div class="flex flex-col gap-3 min-w-[80px] group cursor-pointer">

                            </svg>
                            <div class="text-sm font-medium leading-snug text-gray-200 group-hover:text-white transition-colors">Agentic <br> Research</div>
                        </div>
                        <div class="flex flex-col gap-3 min-w-[80px] group cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-100 group-hover:text-neon transition-colors duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <div class="text-sm font-medium leading-snug text-gray-200 group-hover:text-white transition-colors">Integrity <br> Testing</div>
                        </div>
                    </div>

                    <div>
                        <button class="w-full sm:w-auto border border-neon/50 text-neon px-8 py-3 font-medium rounded-md hover:bg-neon hover:text-black hover:shadow-[0_0_15px_rgba(57,255,20,0.4)] transition-all duration-500 tracking-wide">
                            View Research & Case Studies
                        </button>
                    </div>
                </div>

                <div class="hidden lg:block"></div>
            </div>
        </main>

        <footer class="py-8 px-6 md:px-16 lg:px-24 flex flex-col md:flex-row justify-between items-center text-sm text-gray-400 gap-4 md:gap-0 mt-auto">
            <div class="flex gap-8">
                <a href="#" class="hover:text-neon transition-colors">About</a>
                <a href="#" class="hover:text-neon transition-colors">Lab Notes</a>
                <a href="#" class="hover:text-neon transition-colors">Contact</a>
            </div>
            <div class="text-center md:text-right font-mono text-xs text-gray-500 uppercase tracking-widest">
                © 2026 datatype.org [MUMBAI_NODE]
            </div>
        </footer>
    </div>

</body>
</html>
